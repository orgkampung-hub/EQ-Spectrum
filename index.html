<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>10-Band EQ Spectrum (Taller & Slim LEDs)</title>

  <!-- PWA Manifest & Icons -->
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./icon-192.png">

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #070709;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px 12px;
      overflow-y: auto;
    }

    /* Header Panel Modern */
    .header-panel {
      display: flex;
      width: 100%;
      max-width: 950px;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      flex-wrap: wrap;
      gap: 10px;
    }

    .brand-title {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-badge {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #00e676;
      box-shadow: 0 0 10px #00e676;
      transition: background 0.3s, box-shadow 0.3s;
    }

    h2 {
      color: #fff;
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    /* Segmented Control / Pill Buttons */
    .theme-selector {
      display: flex;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 4px;
      border-radius: 30px;
      backdrop-filter: blur(10px);
      gap: 2px;
      overflow-x: auto;
      max-width: 100%;
      scrollbar-width: none;
    }

    .theme-selector::-webkit-scrollbar {
      display: none;
    }

    .theme-btn {
      background: transparent;
      border: none;
      color: #888;
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .theme-btn .color-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      opacity: 0.6;
      transition: opacity 0.3s, transform 0.3s;
    }

    .theme-btn:hover {
      color: #fff;
    }

    .theme-btn.active {
      color: #fff;
      background: rgba(255, 255, 255, 0.1);
      box-shadow: 0 2px 8px rgba(0,0,0,0.4);
    }

    .theme-btn.active .color-dot {
      opacity: 1;
      transform: scale(1.3);
    }

    .theme-btn[data-theme="theme-classic"] .color-dot { background: #00e676; }
    .theme-btn[data-theme="theme-cyberpunk"] .color-dot { background: #00e5ff; }
    .theme-btn[data-theme="theme-neon"] .color-dot { background: #2979ff; }
    .theme-btn[data-theme="theme-fire"] .color-dot { background: #ff3d00; }
    .theme-btn[data-theme="theme-matrix"] .color-dot { background: #ff1744; }

    /* Bekas EQ - Ditinggikan ke 480px */
    .eq-container {
      display: grid;
      grid-template-columns: repeat(10, minmax(0, 1fr));
      gap: 6px;
      width: 100%;
      max-width: 950px;
      height: 480px;
      margin-bottom: 12px;
      cursor: pointer;
      position: relative;
      background: #0d0e12;
      padding: 10px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .eq-container:hover::after {
      content: 'Tap for Fullscreen';
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(0,0,0,0.6);
      border: 1px solid rgba(255,255,255,0.1);
      color: #888;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 0.65rem;
      pointer-events: none;
      backdrop-filter: blur(4px);
    }

    /* Fullscreen Mode */
    .eq-container:fullscreen,
    .eq-container:-webkit-full-screen {
      width: 100vw !important;
      height: 100vh !important;
      max-width: none !important;
      padding: 20px 15px 80px 15px;
      margin: 0;
      border-radius: 0;
      border: none;
      background: #040406;
    }

    /* Kad Bar EQ */
    .eq-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.04);
      padding: 6px 2px;
      border-radius: 8px;
      height: 100%;
      min-width: 0;
      width: 100%;
    }

    .eq-card .freq-label {
      font-size: 0.65rem;
      font-weight: 600;
      color: #666;
      margin-top: 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      width: 100%;
      text-align: center;
    }

    /* Container Segmen LED */
    .meter-display {
      display: flex;
      flex-direction: column-reverse;
      justify-content: flex-start;
      gap: 1.5px;
      width: 100%;
      height: 100%;
      background: #060608;
      border: 1px solid rgba(255, 255, 255, 0.03);
      padding: 2px;
      border-radius: 6px;
    }

    /* Segmen LED Nipis */
    .led {
      width: 100%;
      height: 100%;
      max-height: 6px;
      background-color: rgba(255, 255, 255, 0.025);
      border-radius: 0.5px;
      transition: background-color 0.015s linear;
    }

    /* Peak Hold LED Nipis */
    .led.peak {
      background-color: #ffffff !important;
      box-shadow: 0 0 6px #ffffff !important;
    }

    /* --- THEMES --- */
    body.theme-classic .brand-badge { background: #00e676; box-shadow: 0 0 10px #00e676; }
    body.theme-classic .led.zone-low.active { background: #00e676; box-shadow: 0 0 4px rgba(0, 230, 118, 0.5); }
    body.theme-classic .led.zone-mid.active { background: #ffeb3b; box-shadow: 0 0 4px rgba(255, 235, 59, 0.5); }
    body.theme-classic .led.zone-high.active { background: #ff1744; box-shadow: 0 0 5px rgba(255, 23, 68, 0.7); }

    body.theme-cyberpunk .brand-badge { background: #00e5ff; box-shadow: 0 0 10px #00e5ff; }
    body.theme-cyberpunk .led.zone-low.active { background: #00e5ff; box-shadow: 0 0 4px rgba(0, 229, 255, 0.5); }
    body.theme-cyberpunk .led.zone-mid.active { background: #aa00ff; box-shadow: 0 0 4px rgba(170, 0, 255, 0.5); }
    body.theme-cyberpunk .led.zone-high.active { background: #ff007f; box-shadow: 0 0 5px rgba(255, 0, 127, 0.7); }

    body.theme-neon .brand-badge { background: #2979ff; box-shadow: 0 0 10px #2979ff; }
    body.theme-neon .led.zone-low.active { background: #2979ff; box-shadow: 0 0 4px rgba(41, 121, 255, 0.5); }
    body.theme-neon .led.zone-mid.active { background: #00b0ff; box-shadow: 0 0 4px rgba(0, 176, 255, 0.5); }
    body.theme-neon .led.zone-high.active { background: #e0f7fa; box-shadow: 0 0 5px rgba(224, 247, 250, 0.7); }

    body.theme-fire .brand-badge { background: #ff3d00; box-shadow: 0 0 10px #ff3d00; }
    body.theme-fire .led.zone-low.active { background: #ff3d00; box-shadow: 0 0 4px rgba(255, 61, 0, 0.5); }
    body.theme-fire .led.zone-mid.active { background: #ff9100; box-shadow: 0 0 4px rgba(255, 145, 0, 0.5); }
    body.theme-fire .led.zone-high.active { background: #ffea00; box-shadow: 0 0 5px rgba(255, 234, 0, 0.7); }

    body.theme-matrix .brand-badge { background: #ff1744; box-shadow: 0 0 10px #ff1744; }
    body.theme-matrix .led.zone-low.active { background: #b71c1c; box-shadow: 0 0 3px rgba(183, 28, 28, 0.5); }
    body.theme-matrix .led.zone-mid.active { background: #f44336; box-shadow: 0 0 4px rgba(244, 67, 54, 0.5); }
    body.theme-matrix .led.zone-high.active { background: #ff8a80; box-shadow: 0 0 5px rgba(255, 138, 128, 0.7); }

    /* Panel Kawalan Audio */
    .controls {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.05);
      padding: 12px;
      border-radius: 12px;
      width: 100%;
      max-width: 950px;
    }

    .btn-group {
      display: flex;
      gap: 10px;
      justify-content: center;
      width: 100%;
    }

    input[type="file"] {
      display: none;
    }

    .btn {
      padding: 8px 18px;
      background: rgba(255, 255, 255, 0.05);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn:hover {
      background: rgba(255, 255, 255, 0.12);
    }

    audio {
      width: 100%;
      height: 36px;
    }

    /* Floating Controls Fullscreen */
    .fs-controls {
      display: none;
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 15, 20, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(12px);
      padding: 8px 18px;
      border-radius: 30px;
      gap: 12px;
      align-items: center;
      z-index: 999;
      width: 90%;
      max-width: 500px;
    }

    .eq-container:fullscreen .fs-controls,
    .eq-container:-webkit-full-screen .fs-controls {
      display: flex;
    }

    .fs-btn {
      background: #fff;
      color: #000;
      border: none;
      padding: 6px 14px;
      border-radius: 20px;
      font-weight: 600;
      font-size: 0.75rem;
      cursor: pointer;
    }

    .fs-seekbar {
      flex: 1;
      height: 4px;
      cursor: pointer;
      accent-color: #fff;
    }

    @media (max-width: 600px) {
      .header-panel {
        flex-direction: column;
        align-items: flex-start;
      }
      .theme-selector {
        width: 100%;
      }
      .eq-container {
        gap: 3px;
        padding: 6px;
        height: 420px;
      }
      .eq-card .freq-label {
        font-size: 0.5rem;
      }
    }
  </style>
</head>
<body class="theme-classic">

  <div class="header-panel">
    <div class="brand-title">
      <div class="brand-badge"></div>
      <h2>10-BAND SPECTRUM</h2>
    </div>

    <div class="theme-selector" id="themeSelector">
      <button class="theme-btn active" data-theme="theme-classic">
        <span class="color-dot"></span>Classic
      </button>
      <button class="theme-btn" data-theme="theme-cyberpunk">
        <span class="color-dot"></span>Cyberpunk
      </button>
      <button class="theme-btn" data-theme="theme-neon">
        <span class="color-dot"></span>Neon
      </button>
      <button class="theme-btn" data-theme="theme-fire">
        <span class="color-dot"></span>Fire
      </button>
      <button class="theme-btn" data-theme="theme-matrix">
        <span class="color-dot"></span>Matrix
      </button>
    </div>
  </div>

  <div class="eq-container" id="eqContainer">
    <div class="fs-controls" onclick="event.stopPropagation();">
      <button class="fs-btn" id="fsPlayBtn">Play/Pause</button>
      <input type="range" id="fsSeekbar" class="fs-seekbar" value="0" min="0" max="100">
      <button class="fs-btn" style="background:rgba(255,255,255,0.15); color:#fff;" id="fsExitBtn">Keluar</button>
    </div>
  </div>

  <div class="controls">
    <div class="btn-group">
      <label class="btn" for="audioFile">Pilih Fail Muzik</label>
      <input type="file" id="audioFile" accept="audio/*">
      <button class="btn" id="micBtn">Guna Mikrofon</button>
    </div>
    <audio id="audioPlayer" controls></audio>
  </div>

  <script>
    // Pendaftaran Service Worker untuk PWA
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('SW Berjaya Didaftar:', reg.scope))
          .catch(err => console.error('SW Gagal Didaftar:', err));
      });
    }

    const NUM_LEDS = 28; 
    
    const BANDS = [
      { label: '31Hz',  startBin: 1,   endBin: 2 },
      { label: '62Hz',  startBin: 3,   endBin: 5 },
      { label: '125Hz', startBin: 6,   endBin: 10 },
      { label: '250Hz', startBin: 11,  endBin: 20 },
      { label: '500Hz', startBin: 21,  endBin: 40 },
      { label: '1kHz',  startBin: 41,  endBin: 80 },
      { label: '2kHz',  startBin: 81,  endBin: 160 },
      { label: '4kHz',  startBin: 161, endBin: 300 },
      { label: '8kHz',  startBin: 301, endBin: 500 },
      { label: '16kHz', startBin: 501, endBin: 800 }
    ];

    const eqContainer = document.getElementById('eqContainer');
    const audioPlayer = document.getElementById('audioPlayer');
    const audioFileInput = document.getElementById('audioFile');
    const micBtn = document.getElementById('micBtn');
    const themeSelector = document.getElementById('themeSelector');

    const fsPlayBtn = document.getElementById('fsPlayBtn');
    const fsSeekbar = document.getElementById('fsSeekbar');
    const fsExitBtn = document.getElementById('fsExitBtn');

    let audioCtx, analyser, sourceNode, micStream;
    let peaks = new Array(BANDS.length).fill(0);

    themeSelector.addEventListener('click', (e) => {
      const btn = e.target.closest('.theme-btn');
      if (!btn) return;

      document.querySelectorAll('.theme-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');

      const selectedTheme = btn.getAttribute('data-theme');
      document.body.className = selectedTheme;
    });

    eqContainer.addEventListener('click', () => {
      if (!document.fullscreenElement && !document.webkitFullscreenElement) {
        if (eqContainer.requestFullscreen) {
          eqContainer.requestFullscreen();
        } else if (eqContainer.webkitRequestFullscreen) {
          eqContainer.webkitRequestFullscreen();
        }
      }
    });

    fsExitBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (document.exitFullscreen) {
        document.exitFullscreen();
      } else if (document.webkitExitFullscreen) {
        document.webkitExitFullscreen();
      }
    });

    fsPlayBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (audioPlayer.paused) {
        audioPlayer.play();
      } else {
        audioPlayer.pause();
      }
    });

    audioPlayer.addEventListener('timeupdate', () => {
      if (audioPlayer.duration) {
        fsSeekbar.value = (audioPlayer.currentTime / audioPlayer.duration) * 100;
      }
    });

    fsSeekbar.addEventListener('input', (e) => {
      e.stopPropagation();
      if (audioPlayer.duration) {
        audioPlayer.currentTime = (fsSeekbar.value / 100) * audioPlayer.duration;
      }
    });

    BANDS.forEach((band, index) => {
      const card = document.createElement('div');
      card.className = 'eq-card';

      const display = document.createElement('div');
      display.className = 'meter-display';
      display.id = `bar-${index}`;

      for (let i = 0; i < NUM_LEDS; i++) {
        const led = document.createElement('div');
        led.classList.add('led');
        
        if (i < 18) led.classList.add('zone-low');
        else if (i < 23) led.classList.add('zone-mid');
        else led.classList.add('zone-high');
        
        display.appendChild(led);
      }

      const label = document.createElement('div');
      label.className = 'freq-label';
      label.textContent = band.label;

      card.appendChild(display);
      card.appendChild(label);
      eqContainer.appendChild(card);
    });

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 2048;
        analyser.smoothingTimeConstant = 0.65;
        renderMeter();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    audioFileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      initAudio();
      if (micStream) micStream.getTracks().forEach(t => t.stop());

      const url = URL.createObjectURL(file);
      audioPlayer.src = url;

      if (!sourceNode || sourceNode.mediaElement !== audioPlayer) {
        if (sourceNode) sourceNode.disconnect();
        sourceNode = audioCtx.createMediaElementSource(audioPlayer);
        sourceNode.connect(analyser);
        analyser.connect(audioCtx.destination);
      }
      audioPlayer.play();
    });

    micBtn.addEventListener('click', async () => {
      initAudio();
      audioPlayer.pause();
      
      try {
        micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        if (sourceNode) sourceNode.disconnect();
        sourceNode = audioCtx.createMediaStreamSource(micStream);
        sourceNode.connect(analyser);
      } catch (err) {
        alert("Gagal mengakses mikrofon: " + err.message);
      }
    });

    function renderMeter() {
      requestAnimationFrame(renderMeter);

      const bufferLength = analyser.frequencyBinCount;
      const dataArray = new Uint8Array(bufferLength);
      analyser.getByteFrequencyData(dataArray);

      BANDS.forEach((band, index) => {
        const val = getAverage(dataArray, band.startBin, band.endBin);
        const display = document.getElementById(`bar-${index}`);
        updateBar(display, val, index);
      });
    }

    function getAverage(array, start, end) {
      let sum = 0;
      let count = 0;
      for (let i = start; i <= end && i < array.length; i++) {
        sum += array[i];
        count++;
      }
      return count > 0 ? sum / count : 0;
    }

    function updateBar(container, value, index) {
      const leds = container.children;
      const activeCount = Math.floor((value / 255) * NUM_LEDS);

      if (activeCount >= peaks[index]) {
        peaks[index] = activeCount;
      } else {
        peaks[index] = Math.max(0, peaks[index] - 0.35);
      }

      const currentPeakIndex = Math.floor(peaks[index]);

      for (let i = 0; i < NUM_LEDS; i++) {
        const led = leds[i];
        led.classList.remove('active', 'peak');

        if (i < activeCount) {
          led.classList.add('active');
        }

        if (i === currentPeakIndex && currentPeakIndex > 0) {
          led.classList.add('peak');
        }
      }
    }
  </script>
</body>
</html>
